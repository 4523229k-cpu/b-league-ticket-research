name: Daily CSV Test

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-csv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile scraping.py

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Check Python imports
        run: |
          python -c "import requests"
          python -c "import bs4"
          python -c "import pandas"

      - name: Create test CSV
        env:
          TZ: Asia/Tokyo
        run: |
          mkdir -p data
          DATE=$(date +%F)
          echo "取得日,テスト" > "data/bj_league_ticket_data_${DATE}.csv"
          echo "${DATE},成功" >> "data/bj_league_ticket_data_${DATE}.csv"

      - name: Save CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Save daily CSV"
            git push
          fi
